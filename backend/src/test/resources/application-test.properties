# Tests run against in-memory H2 seeded with the same DDL as production PostgreSQL
# (see schema.sql), with ddl-auto=validate so entity/schema drift fails the build.
spring.datasource.url=jdbc:h2:mem:steptrack;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

jwt.secret=test-secret-key-that-is-definitely-long-enough-for-hs256
jwt.expiration=86400000
app.google.client-ids=
app.cors.allowedOrigins=http://localhost:3000

logging.level.org.hibernate.tool.schema=WARN
