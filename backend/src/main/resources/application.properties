## Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/steptrack}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

## JPA/Hibernate Configuration
# The dialect is auto-detected from the JDBC connection; do not pin a version-specific
# dialect class (the PostgreSQL<N>Dialect classes were removed in Hibernate 6).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

## Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api
server.compression.enabled=true
server.compression.min-response-size=1024

## Logging
logging.level.root=INFO
logging.level.com.steptrack=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

## JWT Configuration
# JWT_SECRET must be at least 32 characters (256 bits) for HS256.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-minimum-256-bits-long}
jwt.expiration=${JWT_EXPIRATION:86400000}

## Google Sign-In
# Comma-separated OAuth client IDs accepted as the "aud" claim of incoming Google ID
# tokens. A Flutter app needs one entry per platform it ships on (Android, iOS, Web).
app.google.client-ids=${GOOGLE_CLIENT_IDS:}

## Application Configuration
app.name=Steptrack API
app.version=1.0.0
app.cors.allowedOrigins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:8080}
